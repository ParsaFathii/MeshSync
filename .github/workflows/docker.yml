# MeshSync — Docker image build & push to GHCR.
#
# Runs on version tags (v*) and manual dispatch. On a tag push the image is
# published to ghcr.io/parsafathii/meshsync as both :<version> and :latest.
# On workflow_dispatch the image is only built (no push) so the Dockerfile
# can be validated without publishing.
#
# The image is multi-arch (linux/amd64 + linux/arm64) — the agent is pure Go
# (modernc.org/sqlite, CGO_ENABLED=0) so it cross-builds cleanly.
name: Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push the image to GHCR

jobs:
  docker:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          set -eu
          image="ghcr.io/parsafathii/meshsync"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            {
              echo "tags<<EOF"
              echo "${image}:${version}"
              echo "${image}:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "${image}:ci"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and push on tags) the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.tags.outputs.push }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
