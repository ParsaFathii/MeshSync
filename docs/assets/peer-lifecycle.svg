<?xml version="1.0" encoding="UTF-8"?>
<!-- MeshSync original diagram — peer trust lifecycle state machine (EN labels). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="640" fill="#ffffff"/>
  <text x="30" y="38" font-size="18" font-weight="700" fill="#0f172a">MeshSync — peer trust lifecycle</text>
  <text x="30" y="58" font-size="12" fill="#64748b">Trust is granted only through explicit pairing approval; discovery never trusts.</text>

  <!-- entry point -->
  <rect x="30" y="105" width="170" height="52" rx="26" fill="#f1f5f9" stroke="#64748b"/>
  <text x="115" y="136" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">beacon seen on LAN</text>
  <path d="M200,131 L260,131" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- DISCOVERED -->
  <rect x="265" y="95" width="200" height="72" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="365" y="124" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">DISCOVERED</text>
  <text x="365" y="144" font-size="11" fill="#475569" text-anchor="middle">recorded, no sync rights,</text>
  <text x="365" y="158" font-size="11" fill="#475569" text-anchor="middle">key not pinned yet</text>

  <!-- pair request -->
  <path d="M465,131 L560,131" stroke="#0d9488" stroke-width="2" marker-end="url(#arrTeal)"/>
  <text x="512" y="120" font-size="11" fill="#0f766e" text-anchor="middle">POST /peers/pair</text>

  <!-- PAIRING -->
  <rect x="565" y="95" width="200" height="72" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="665" y="124" font-size="15" font-weight="700" fill="#134e4a" text-anchor="middle">PAIRING</text>
  <text x="665" y="144" font-size="11" fill="#0f766e" text-anchor="middle">request recorded,</text>
  <text x="665" y="158" font-size="11" fill="#0f766e" text-anchor="middle">awaiting approval</text>

  <!-- rejected: back to DISCOVERED -->
  <path d="M665,95 C665,55 365,55 365,93" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#arrAmber)"/>
  <text x="515" y="50" font-size="11" fill="#92400e" text-anchor="middle">pairing rejected → key learned, still untrusted</text>

  <!-- approve -->
  <path d="M765,131 L860,131" stroke="#0d9488" stroke-width="2" marker-end="url(#arrTeal)"/>
  <text x="812" y="120" font-size="11" fill="#0f766e" text-anchor="middle">POST /peers/{id}/approve</text>

  <!-- TRUSTED -->
  <rect x="865" y="95" width="210" height="72" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="970" y="124" font-size="15" font-weight="700" fill="#134e4a" text-anchor="middle">TRUSTED</text>
  <text x="970" y="144" font-size="11" fill="#0f766e" text-anchor="middle">sync, manifests, transfers;</text>
  <text x="970" y="158" font-size="11" fill="#0f766e" text-anchor="middle">Ed25519 key pinned in DB</text>

  <!-- online/offline marker on TRUSTED -->
  <rect x="880" y="185" width="180" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 3"/>
  <text x="970" y="208" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">online / offline</text>
  <text x="970" y="226" font-size="10" fill="#64748b" text-anchor="middle">monitor probes every ~2 s,</text>
  <text x="970" y="238" font-size="10" fill="#64748b" text-anchor="middle">backoff 10 s → 60 s on failure</text>
  <line x1="970" y1="167" x2="970" y2="185" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- revoke -->
  <path d="M970,167 C970,300 665,300 665,209" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="817" y="312" font-size="11" fill="#b91c1c" text-anchor="middle">POST /peers/{id}/revoke — connections refused, future pairing attempts blocked</text>

  <!-- REVOKED -->
  <rect x="555" y="360" width="220" height="76" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="665" y="390" font-size="15" font-weight="700" fill="#7f1d1d" text-anchor="middle">REVOKED</text>
  <text x="665" y="410" font-size="11" fill="#991b1b" text-anchor="middle">record kept; handshake rejected</text>
  <text x="665" y="424" font-size="11" fill="#991b1b" text-anchor="middle">with REVOKED wire error</text>

  <!-- delete -->
  <path d="M555,398 L430,398" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="492" y="387" font-size="11" fill="#475569" text-anchor="middle">DELETE /peers/{id}</text>

  <!-- removed -->
  <rect x="215" y="368" width="210" height="60" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="320" y="393" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">record removed</text>
  <text x="320" y="411" font-size="11" fill="#94a3b8" text-anchor="middle">peer can be discovered and re-paired</text>

  <!-- note: trust convergence -->
  <rect x="30" y="470" width="1120" height="120" rx="10" fill="#fffbeb" stroke="#b45309"/>
  <text x="50" y="498" font-size="13" font-weight="700" fill="#78350f">How both sides become TRUSTED</text>
  <text x="50" y="522" font-size="12" fill="#92400e">1. Device A sends POST /peers/pair { "address": "host:4041" } — a PAIR_REQUEST frame over TLS; the peer's Ed25519 key is learned from its certificate.</text>
  <text x="50" y="542" font-size="12" fill="#92400e">2. Device B sees the request as a peer in PAIRING and approves it (POST /peers/{peerId}/approve).</text>
  <text x="50" y="562" font-size="12" fill="#92400e">3. B marks A trusted and sends PAIR_APPROVED back; A flips its own record to TRUSTED on receipt. If A had already approved B, both sides converge immediately.</text>
  <text x="50" y="582" font-size="12" fill="#92400e">Trust is symmetric and explicit on both devices; a changed identity key for a known peer is rejected as IDENTITY_MISMATCH until the record is removed and re-paired.</text>
</svg>
